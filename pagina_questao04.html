<body>
    <div id="geral">

    <h3> Entrar com Nome, 3 notas de um aluno. Ache a média. Caso
        a média seja maior ou igual a 6, apresentar o texto
        Aprovado, caso contrário apresentar o texto Reprovado </h3>
        
    

    <form id="formulario">

        <label for="Nome"> Nome do aluno(a): </label>
        <input type="text" name="Nome" id="Nome">

        <label for="num1"> Nota 1 </label>
        <input type="number" name="num1" id="num1">

        <label for="num2"> Nota 2: </label>
        <input type="number" name="num2" id="num2">

        <label for="num3"> Nota 3: </label>
        <input type="number" name="num3" id="num3">

        <button type="submit"> Calcular </button>
        <button type="reset"> Limpar </button>

    </form>

    <div id="resultado">
        
    </div>
    
    </div>
    

</body>
